name: golangci-lint

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'PROJECT'
      - 'SECURITY_CONTACTS'

jobs:
  golangci:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    # The Makefile pins the version of golangci-lint for local runs too.
    - name: Get the golangci-lint version
      id: golangci-lint-version
      run: echo "version=$(sed -n 's/^GOLANGCI_LINT_VER := //p' Makefile)" >> "$GITHUB_OUTPUT"

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: ${{ steps.golangci-lint-version.outputs.version }}

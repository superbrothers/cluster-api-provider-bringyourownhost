name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'PROJECT'
      - 'SECURITY_CONTACTS'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'PROJECT'
      - 'SECURITY_CONTACTS'

jobs:
  build-agent:
      runs-on: ubuntu-24.04
      steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: build agent
        run: make host-agent-binaries

  test:
    runs-on: ubuntu-24.04
    steps:
    - name: Check Docker Version
      run: docker --version
    
    - name: Uninstall podman if installed
      run: sudo apt-get purge podman && sudo rm -rf /etc/cni/net.d/

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: turn off swap
      run: sudo swapoff -a
    
    - name: Set netfilter conntrack max
      run: sudo sysctl -w net.netfilter.nf_conntrack_max=131072

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Install prequisit packages
      run: sudo apt update && sudo apt install -qq --yes socat ebtables ethtool conntrack

    - name: Run test make target
      run: make test

    - name: Upload test coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: cover.out
        verbose: true

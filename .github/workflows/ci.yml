name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'PROJECT'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'PROJECT'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Verify the systemd unit of containerd in the installer
      run: make verify-containerd-service

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    # The test job does not regenerate these files, so that the committed ones
    # are tested; check here that they are up to date instead.
    - name: Verify the generated files and the format
      run: |
        make generate manifests cluster-templates cluster-templates-e2e fmt
        git diff --exit-code
        if [ -n "$(git status --porcelain)" ]; then
          git status --porcelain
          echo "::error::The generators created files that are not committed."
          exit 1
        fi

    # golangci-lint runs only on pull requests.
    - name: Vet
      run: make vet

  # Each architecture tests its deb package on a runner of the architecture,
  # so that the binary of the agent runs on arm64 as well. The amd64 runner
  # also builds the arm64 package, as the release builds both there.
  build-agent:
      name: build-agent (${{ matrix.arch }})
      strategy:
        fail-fast: false
        matrix:
          include:
          - arch: amd64
            runner: ubuntu-24.04
            archs: amd64 arm64
          - arch: arm64
            runner: ubuntu-24.04-arm
            archs: arm64
      runs-on: ${{ matrix.runner }}
      steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The agent is built in a container, so this job would save an empty
      # cache of Go first, and the other jobs would restore it.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # This builds the binaries of the agent, and packages them.
      - name: Build the agent and its deb packages
        run: make host-agent-debs HOST_AGENT_ARCHS="${{ matrix.archs }}"

      # The runner is a throwaway machine with systemd, on which the test can
      # install and remove the package.
      - name: Test the deb package
        run: sudo hack/test-host-agent-deb.sh _dist/byoh-hostagent_*_${{ matrix.arch }}.deb

  build-image:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # The default docker driver cannot build images for multiple platforms.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build the manager image for amd64 and arm64
      run: make docker-buildx

  test:
    runs-on: ubuntu-24.04
    steps:
    - name: Check Docker Version
      run: docker --version
    
    - name: Uninstall podman if installed
      run: sudo apt-get purge podman && sudo rm -rf /etc/cni/net.d/

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: turn off swap
      run: sudo swapoff -a
    
    - name: Set netfilter conntrack max
      run: sudo sysctl -w net.netfilter.nf_conntrack_max=131072

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Install prequisit packages
      run: sudo apt update && sudo apt install -qq --yes socat ebtables ethtool conntrack

    # The verify job checks the generated files, the format and vet.
    - name: Run the tests
      run: make test-coverage

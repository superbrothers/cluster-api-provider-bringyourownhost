name: e2e-suite

# Pull requests run only the [PR-Blocking] spec, as each spec creates clusters
# on the hosts in containers; drafts are skipped, and a pull request runs it
# when it is marked ready for review. All the specs run every week and on
# demand.
on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths-ignore:
    - '*.md'
    - 'docs/**'
    - 'LICENSE'
    - 'NOTICE'
    - 'PROJECT'
  schedule:
  # Every Sunday at 19:17 UTC.
  - cron: '17 19 * * 0'
  workflow_dispatch:
    inputs:
      focus:
        description: 'The regular expression of the specs to run (GINKGO_FOCUS). Empty runs all the specs.'
        required: false
        default: ''

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: turn off swap
      run: sudo swapoff -a

    - name: Set netfilter conntrack max
      run: sudo sysctl -w net.netfilter.nf_conntrack_max=131072

    # The hosts in containers use the inotify instances and watches of root on
    # the runner.
    - name: Raise the inotify limits
      run: sudo sysctl -w fs.inotify.max_user_instances=512 fs.inotify.max_user_watches=524288

    # Ginkgo stops the whole suite after 1h by default.
    - name: Run the e2e tests
      env:
        GINKGO_FOCUS: ${{ github.event_name == 'pull_request' && '\[PR-Blocking\]' || inputs.focus }}
        GINKGO_NOCOLOR: 'true'
        GINKGO_ARGS: --timeout=2h
      run: yes | make test-e2e

    # The logs of the controllers and the dumps of the resources.
    - name: Upload the artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-artifacts
        path: _artifacts
        retention-days: 7

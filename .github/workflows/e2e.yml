name: e2e-suite

# The e2e tests have not been reworked yet, so they run only on demand until
# they are.
on:
  workflow_dispatch:

jobs:
  e2e-pr-blocking:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: turn off swap
      run: sudo swapoff -a

    - name: Set netfilter conntrack max
      run: sudo sysctl -w net.netfilter.nf_conntrack_max=131072

    # The hosts in containers use the inotify instances and watches of root on
    # the runner.
    - name: Raise the inotify limits
      run: sudo sysctl -w fs.inotify.max_user_instances=512 fs.inotify.max_user_watches=524288

    - name: Run Cluster Class e2e tests
      run: yes | GINKGO_FOCUS="\[Cluster-Class\]" make test-e2e

    - name: Run PR-Blocking e2e tests
      run: yes | GINKGO_FOCUS="\[PR-Blocking\]" make test-e2e

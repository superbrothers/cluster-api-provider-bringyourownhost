# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - dupl
    - dupword
    - errcheck
    - funlen
    - goconst
    - gocritic
    - gocyclo
    - goheader
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - mnd
    - nakedret
    - noctx
    - rowserrcheck
    - staticcheck
    - testpackage
    - unconvert
    - unused
    - whitespace

  # don't enable:
  # - asciicheck
  # - exhaustive
  # - gochecknoinits
  # - gochecknoglobals
  # - gocognit
  # - godot
  # - godox
  # - err113
  # - lll
  # - nestif
  # - nolintlint
  # - prealloc
  # - revive
  # - unparam
  # - wsl

  settings:
    dupl:
      threshold: 100
    funlen:
      lines: 100
      statements: 50
    goheader:
      values:
        const:
          LICENSE: Apache-2.0
        regexp:
          YEAR: 20\d*-*\d*
          # Files from upstream keep the VMware notice; files added in this
          # fork use the project authors.
          HOLDER: (VMware, Inc\. All Rights Reserved\.|The Cluster API Provider BringYourOwnHost Authors\.)
      template: |-
        Copyright {{ YEAR }} {{ HOLDER }}
        SPDX-License-Identifier: {{ LICENSE }}
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport # https://github.com/go-critic/go-critic/issues/845
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
    gocyclo:
      min-complexity: 15
    govet:
      enable:
        - shadow
    misspell:
      locale: US
    mnd:
      checks:
        - argument
        - case
        - condition
        - return
      ignored-functions:
        - log.*
    staticcheck:
      # The default checks, except QF1008. golangci-lint v1 did not run the
      # quick fix checks, and selectors such as obj.ObjectMeta.Name are clear.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1008
    whitespace:
      multi-func: true

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - .*fakes/
      - .*dummy.go
    rules:
      # Exclude some linters from running on tests files.
      - path: _test\.go
        linters:
          - dupl
          - goconst
          - gosec
      # The resources of this provider implement the v1beta1 contract of
      # Cluster API, and use the deprecated v1beta1 types, conditions and patch
      # helper until they move to the v1beta2 contract.
      - linters:
          - staticcheck
        text: 'SA1019: "sigs.k8s.io/cluster-api/(api/core/v1beta1|util/deprecated/v1beta1/(conditions|patch))" is deprecated'

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true

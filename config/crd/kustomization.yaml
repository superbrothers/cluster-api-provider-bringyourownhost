# This kustomization.yaml is not intended to be run by itself,
# since it depends on service name and namespace that are out of this kustomize package.
# It should be run by config/default

labels:
- pairs:
    cluster.x-k8s.io/v1beta1: v1beta1

resources:
- bases/infrastructure.cluster.x-k8s.io_byomachines.yaml
- bases/infrastructure.cluster.x-k8s.io_byohosts.yaml
- bases/infrastructure.cluster.x-k8s.io_byomachinetemplates.yaml
- bases/infrastructure.cluster.x-k8s.io_byoclusters.yaml
- bases/infrastructure.cluster.x-k8s.io_byoclustertemplates.yaml
- bases/infrastructure.cluster.x-k8s.io_k8sinstallerconfigs.yaml
- bases/infrastructure.cluster.x-k8s.io_k8sinstallerconfigtemplates.yaml
- bases/infrastructure.cluster.x-k8s.io_bootstrapkubeconfigs.yaml
#+kubebuilder:scaffold:crdkustomizeresource

patches:
# [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix.
# patches here are for enabling the conversion webhook for each CRD
#- path: patches/webhook_in_byomachines.yaml
- path: patches/webhook_in_byohosts.yaml
#- path: patches/webhook_in_byomachinetemplates.yaml
- path: patches/webhook_in_byoclusters.yaml
- path: patches/webhook_in_byoclustertemplates.yaml
#- path: patches/webhook_in_byohosts.yaml
#- path: patches/webhook_in_k8sinstallerconfigs.yaml
#- path: patches/webhook_in_k8sinstallerconfigtemplates.yaml
#- path: patches/webhook_in_bootstrapkubeconfigs.yaml
#+kubebuilder:scaffold:crdkustomizewebhookpatch

# [CERTMANAGER] To enable webhook, uncomment all the sections with [CERTMANAGER] prefix.
# patches here are for enabling the CA injection for each CRD
#- path: patches/cainjection_in_byomachines.yaml
- path: patches/cainjection_in_byohosts.yaml
#- path: patches/cainjection_in_byomachinetemplates.yaml
- path: patches/cainjection_in_byoclusters.yaml
- path: patches/cainjection_in_byoclustertemplates.yaml
#- path: patches/cainjection_in_byohosts.yaml
#- path: patches/cainjection_in_k8sinstallerconfigs.yaml
#- path: patches/cainjection_in_k8sinstallerconfigtemplates.yaml
#- path: patches/cainjection_in_bootstrapkubeconfigs.yaml
#+kubebuilder:scaffold:crdkustomizecainjectionpatch

# the following config is for teaching kustomize how to do kustomization for CRDs.
configurations:
- kustomizeconfig.yaml

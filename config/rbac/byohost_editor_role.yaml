# Permissions of the agents (the group byoh:hosts) on ByoHosts. An agent
# creates the ByoHost of its host, and then writes only its status. The ByoHost
# webhook limits each agent to its own ByoHost.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: byohost-editor-role
rules:
- apiGroups:
  - infrastructure.cluster.x-k8s.io
  resources:
  - byohosts
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - infrastructure.cluster.x-k8s.io
  resources:
  - byohosts/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
